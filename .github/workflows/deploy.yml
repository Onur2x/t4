name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase config uret (gizli kasadan, repoya yazilmaz)
        run: |
          cat > supabase-config.js <<'EOF'
          window.__SB__ = {
            URL: "${{ secrets.SUPABASE_URL }}",
            ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF
          touch .nojekyll

      - name: Gizli dosya sizinti kontrolu
        run: |
          if grep -q "service_role" supabase-config.js; then
            echo "HATA: service_role anahtari tespit edildi!"
            exit 1
          fi
          echo "OK: publishable anahtar"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Artifact servisinin oturmasi icin bekle
        run: sleep 20

      - id: deployment
        uses: actions/deploy-pages@v4
